name: CI

# Gatilhos de disparo para a branch develop e manual
on:
  #workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

defaults:
  run:
    working-directory: ./myRecipeBook

jobs:
  build-and-tests:
    name: Build and Tests
    runs-on: ubuntu-latest

    # Permissão necessária para que as ferramentas publiquem os relatórios de cobertura
    permissions:
      pull-requests: write
      contents: write
      checks: write
      statuses: write

    steps:
      # Passo obrigatório para baixar o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # Instalação do SDK do .NET 10
      - name: Installing .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Execução do Build
      - name: Build
        run: dotnet build

      # Execução dos Testes com o logger de resultado e os argumentos do Coverlet
      - name: Test
        run: dotnet test --settings test/coverlet.runsettings --logger trx --results-directory TestResults

      # Publicação dos Resultados de Testes (Equivalente ao publichTestResults: true)
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Garante que rode mesmo se algum teste falhar
        with:
          files: '**/TestResults/*.trx'

      # 1. NOVO: Gerar Relatório Gráfico em Markdown (Substituindo a action anterior)
      - name: Generate Code Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.3
        if: always()
        with:
          reports: '**/TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'MarkdownSummary;HtmlSummary' # Gera um sumário visual em markdown e uma página web completa

      # 2. NOVO: Publicar o gráfico/tabela gerada diretamente no Sumário do Job do GitHub
      - name: Publish Coverage to Job Summary
        run: cat coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY
        if: always()

      # 3. OPCIONAL: Se você quiser que o gráfico apareça também como comentário no Pull Request
      - name: Write PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          path: myRecipeBook/coveragereport/Summary.md

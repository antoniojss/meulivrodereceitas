name: .NET Core CI (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch: # <--- ADICIONE ESTA LINHA AQUI (Permite rodar manualmente pelo site)

permissions:
  pull-requests: write
  contents: write
# CONFIGURAÇÃO DE DIRETÓRIO GLOBAL
defaults:
  run:
    working-directory: ./src  # <-- Substitua pelo nome da pasta onde fica sua Solution (.sln) ou Projeto (.csproj)

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    # 1. Baixa o código do repositório
    - uses: actions/checkout@v4

    # 2. Configura o ambiente com o SDK do .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x # Altere para a versão do seu projeto (6.0, 7.0, 8.0, 9.0 etc.)

    # 3. Restaura as dependências (NuGet)
    - name: Restore dependencies
      run: dotnet restore

    # 4. Compila o projeto sem baixar as dependências de novo
    - name: Build
      run: dotnet build --no-restore --configuration Release

    # 5. Executa os testes e coleta a cobertura com o Coverlet
    - name: Run Tests with Coverlet
      run: |
        dotnet test --configuration Release --no-build \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=cobertura \
        /p:CoverletOutput=./TestResults/

    # 6. (Opcional) Publica o relatório XML como um artefato do build para download
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: '**/TestResults/coverage.cobertura.xml'

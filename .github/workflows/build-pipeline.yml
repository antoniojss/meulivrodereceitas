name: .NET Core CI (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

defaults:
  run:
    working-directory: ./myRecipeBook

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
 
    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    # CORREÇÃO 1: Adicionada a barra "/" no final de TestResults/ para forçar a criação como diretório
    - name: Run Tests with Coverlet
      run: |
        dotnet test --configuration Release --no-build \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=cobertura \
        /p:CoverletOutput=./TestResults/

    # CORREÇÃO 2: Ampliado o caminho de busca para buscar recursivamente em qualquer TestResults do projeto
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: '**/TestResults/coverage.cobertura.xml'

    # CORREÇÃO 3: Ajustada a leitura do resumo para usar o mapeamento amplo também
    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: '**/TestResults/coverage.cobertura.xml'
        badge: true
        fail_below_min: false
        format: markdown
        output: both

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

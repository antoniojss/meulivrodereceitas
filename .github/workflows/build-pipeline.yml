name: .NET Core CI (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

defaults:
  run:
    working-directory: ./myRecipeBook

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    # AJUSTE 1: Salvamos o relatório diretamente na raiz do repositório usando uma pasta temporária previsível
    - name: Run Tests with Coverlet
      run: |
        dotnet test --configuration Release --no-build \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=cobertura \
        /p:CoverletOutput=../coverage.cobertura.xml

    # AJUSTE 2: Como subimos um nível no comando anterior (../), o arquivo está na raiz do repositório
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coverage.cobertura.xml

    # AJUSTE 3: Como a Action roda no Docker a partir da raiz, ela agora achará o arquivo "coverage.cobertura.xml" diretamente
    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both

    # AJUSTE 4: Ajustado para pegar o markdown gerado na raiz
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: ../code-coverage-results.md

name: .NET Core CI (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

#permissions:
#  pull-requests: write
#  contents: write

defaults:
  run:
    working-directory: ./meulivrodereceitas 

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    # 1. Executa os testes usando o coletor cross-platform padrão do .NET (Gera em TestResults/)
    - name: Run Tests
      run: |
        dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./meulivrodereceitas/TestResults

    # 2. Comando Linux para pescar o arquivo gerado em subpastas dinâmicas e mover para a raiz do repositório
    - name: Extract and Move Coverage File
      run: |
        find ./meulivrodereceitas/TestResults -name "coverage.cobertura.xml" -exec cp {} ./coverage.cobertura.xml \;
      shell: bash
  
    # 3. Faz o upload do artefato pegando direto da raiz do repositório
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coverage.cobertura.xml

    # 4. Agora a Action Docker encontrará o arquivo "coverage.cobertura.xml" exatamente onde ela busca por padrão
    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both
  # 5. Adiciona o comentário no PR coletando o arquivo markdown gerado na raiz
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: ./code-coverage-results.md

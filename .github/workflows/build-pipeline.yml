name: CI

# Gatilhos de disparo para a branch develop e manual
on:
  workflow_dispatch:
  
  push:
    branches:
      - develop
      
  pull_request:
    branches:
      - develop

# Configura a subpasta padrão para todos os comandos de terminal (run)
defaults:
  run:
    working-directory: ./meulivrodereceitas/

jobs:
  build-and-tests:
    name: Build and Tests
    runs-on: ubuntu-latest
    
    # Permissão necessária para que as ferramentas publiquem os relatórios de cobertura
    permissions:
      pull-requests: write
      contents: write
      code-quality: write

    steps:
      # Passo obrigatório para baixar o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # Instalação do SDK do .NET 10
      - name: Installing .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Execução do Build
      - name: Build
        run: dotnet build

      # Execução dos Testes com o logger de resultado e os argumentos do Coverlet
      - name: Tests
        run: dotnet test --settings tests/coverlet.runsettings --logger trx --results-directory TestResults

      # Publicação dos Resultados de Testes (Equivalente ao publichTestResults: true)
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Garante que rode mesmo se algum teste falhar
        with:
          files: '**/TestResults/*.trx'

      # Publicação da Cobertura de Código no sumário do GitHub (Equivalente ao PublihCodeCoverrageResult@2)
      - name: Publish Code Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: '**/TestResults/**/coverage.cobertura.xml'
          badge: true
          fail_below_min: false
          format: markdown
          output: both

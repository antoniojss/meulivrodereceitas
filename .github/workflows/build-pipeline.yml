name: .NET Core CI (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

defaults:
  run:
    working-directory: ./myRecipeBook

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    # AJUSTE 1: Alterado o Coverlet para gerar um arquivo único na pasta raiz do working-directory
    - name: Run Tests with Coverlet
      run: |
        dotnet test --configuration Release --no-build \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=cobertura \
        /p:CoverletOutput=${{ github.workspace }}/myRecipeBook/TestResults/

    # AJUSTE 2: Especificamos o caminho exato a partir do diretório de trabalho
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: myRecipeBook/TestResults/coverage.cobertura.xml

    # AJUSTE 3: O CodeCoverageSummary precisa do arquivo no caminho exato gerado
    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: myRecipeBook/TestResults/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: myRecipeBook/code-coverage-results.md

name: CI

# Gatilhos de disparo para a branch develop e manual
on:
  workflow_dispatch:
  
  push:
    branches: [ develop ]
    
  pull_request:
    branches: [ develop ]

jobs:
  build-and-tests:
    name: Build and Tests
    runs-on: ubuntu-latest

    steps:
    # Passo obrigatório no GitHub Actions para baixar o código do repositório
    - name: Checkout code
      uses: actions/checkout@v4

    # Instalação do SDK do .NET 10
    - name: Installing .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    # Execução do Build
    - name: Build
      run: dotnet build

    # Execução dos Testes
    - name: Tests
      run: dotnet test
